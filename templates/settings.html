<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Settings</title><link rel="stylesheet" href="/static/css/style.css"></head><body><main class="shell narrow"><header><h1>Settings</h1><a href="/">Back</a></header><p>Provider and model are configured through <code>.env</code>. API keys are never shown here.</p><label>Retrieved examples <input type="number" value="5" min="1" max="8"></label><label>Temperature <input type="number" value="0.7" min="0" max="2" step=".1"></label><button id="delete">Delete all imported data</button><p id="status"></p></main><script>document.querySelector('#delete').onclick=async()=>{if(confirm('Delete all local chat data?')){await fetch('/api/data/clear',{method:'POST'});document.querySelector('#status').textContent='All imported data deleted.'}}</script></body></html>
